<!DOCTYPE html>
<html>
<head>
  <title>Goosebumps Gazette</title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* Top title */
    .title {
  text-align: center;
  font-size: 70px;
  color: #00ff2a;

  font-family: 'Rubik Wet Paint', cursive;

  margin-top: 30px;
  margin-bottom: 10px;

  font-weight: bold;
  letter-spacing: 2px;

  /* glow effect */
  text-shadow:
    0 0 5px #00ff2a,
    0 0 10px #00ff2a,
    0 0 20px #00aa00,
    0 0 40px #006600;
}

    /* Middle content column */
    .content {
  width: 50%;
  margin: 0 auto;
  border-left: 2px solid red;
  border-right: 2px solid red;
  padding: 20px;
  min-height: 100vh;
  box-sizing: border-box;
}

/* When screen gets smaller */
@media (max-width: 900px) {
  .content {
    width: 80%;
  }
}

@media (max-width: 600px) {
  .content {
    width: 95%;
    border-left: none;
    border-right: none;
  }
}

    /* Intro text */
    .intro {
      margin-bottom: 30px;
    }

    /* Subtitle */
    .subtitle {
      color: #00aa00;
      text-decoration: underline;
      font-size: 24px;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    /* Links */
    a {
      color: white;
      display: block;
      margin: 5px 0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="title">Goosebumps Gazette</div>

  <div class="content">

    <div class="intro">
      Welcome to the Goosebumps Gazette! Here I write my thoughts on the Goosebumps franchise.
    </div>

    <div class="subtitle">Main Pages</div>

    <a href="#">x</a>
    <a href="#">y</a>
    <a href="#">z</a>
    <a href="#">xy</a>
    <a href="#">yz</a>
    <a href="#">zz</a>

  </div>

</body>
</html>

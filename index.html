<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Goosebumps Gazette</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* Top title */
    .title {
      display: block; /* Added to ensure text-align: center works perfectly */
      text-align: center;
      font-size: 70px;
      color: #00cc44;
      font-family: 'Rubik Wet Paint', cursive;
      margin-top: 30px;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-decoration: none; /* removes underline */
      
      /* glow effect */
      text-shadow:
        0 0 2px #00cc44,
        0 0 6px #009933,
        0 0 12px #006622;
    }

    /* Middle content column */
    .content {
      width: 50%;
      margin: 0 auto;
      border-left: 4px #b30000;
      border-right: 4px #b30000;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* When screen gets smaller */
    @media (max-width: 900px) {
      .content {
        width: 80%;
      }
    }

    @media (max-width: 600px) {
      .content {
        width: 95%;
        border-left: none;
        border-right: none;
      }
    }

    /* Intro text */
    .intro {
      margin-bottom: 30px;
    }

    /* Subtitle */
    .subtitle {
      color: #00aa00;
      text-decoration: underline;
      font-size: 24px;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    /* Links */
    a {
      color: white;
      display: block;
      margin: 5px 0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
    
    /* Prevents the title link from turning white on hover like the other links */
    a.title:hover {
      text-decoration: none;
      color: #00cc44;
    }
  </style>
</head>

<body>

  <a href="index.html" class="title">Goosebumps Gazette</a>

  <div class="content">

    <div class="intro">
      Welcome to the Goosebumps Gazette! Here I write my thoughts on the Goosebumps franchise.
    </div>

    <div class="subtitle">Main Pages</div>

    <a href="#">x</a>
    <a href="#">y</a>
    <a href="#">z</a>
    <a href="#">xy</a>
    <a href="#">yz</a>
    <a href="#">zz</a>

  </div>

</body>
</html>
